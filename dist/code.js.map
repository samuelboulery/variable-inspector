export default "<!DOCTYPE html>\n<html>\n\n<head>\n  <meta charset=\"UTF-8\" />\n</head>\n\n<body>\n  <div id=\"app\"></div>\n  <div class=\"resize-handle\">\n    <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n      <path\n        d=\"M17.5 6.25C17.5 5.55964 18.0596 5 18.75 5C19.4404 5 20 5.55964 20 6.25C20 13.8439 13.8439 20 6.25 20C5.55964 20 5 19.4404 5 18.75C5 18.0596 5.55964 17.5 6.25 17.5C12.4632 17.5 17.5 12.4632 17.5 6.25Z\"\n        fill=\"currentColor\" />\n    </svg>\n  </div>\n  <script>\n    // Surfaçage des erreurs runtime — sinon le panneau Figma reste blanc\n    // sans aucun feedback. Affiche l'erreur dans le DOM directement.\n    window.addEventListener('error', (ev) => {\n      const app = document.getElementById('app');\n      if (!app) return;\n      const errBox = document.createElement('div');\n      errBox.style.cssText = 'padding:1rem;background:#fee;color:#900;font:12px monospace;white-space:pre-wrap;';\n      errBox.textContent = `JS error: ${ev.message}\\nat ${ev.filename}:${ev.lineno}:${ev.colno}`;\n      app.appendChild(errBox);\n    });\n\n    // Gestion du redimensionnement — throttle via requestAnimationFrame\n    // pour éviter de spammer postMessage à chaque pixel de mouvement (1 par\n    // frame maximum). Sur grosse sélection cela évite que le canal de\n    // messages plugin/UI se sature pendant un drag de resize.\n    const resizeHandle = document.querySelector('.resize-handle');\n    let isResizing = false;\n    let startX, startY, startWidth, startHeight;\n    let pendingResize = null;\n    let rafScheduled = false;\n\n    function flushResize() {\n      rafScheduled = false;\n      if (!pendingResize) return;\n      parent.postMessage({\n        pluginMessage: {\n          type: 'resize',\n          width: pendingResize.width,\n          height: pendingResize.height\n        }\n      }, '*');\n      pendingResize = null;\n    }\n\n    resizeHandle.addEventListener('mousedown', (e) => {\n      isResizing = true;\n      startX = e.clientX;\n      startY = e.clientY;\n      startWidth = window.innerWidth;\n      startHeight = window.innerHeight;\n      e.preventDefault();\n    });\n\n    document.addEventListener('mousemove', (e) => {\n      if (!isResizing) return;\n      pendingResize = {\n        width: Math.max(300, startWidth + (e.clientX - startX)),\n        height: Math.max(200, startHeight + (e.clientY - startY))\n      };\n      if (!rafScheduled) {\n        rafScheduled = true;\n        requestAnimationFrame(flushResize);\n      }\n    });\n\n    document.addEventListener('mouseup', () => {\n      if (isResizing && pendingResize) flushResize();\n      isResizing = false;\n    });\n\n    // Empêche la sélection de texte pendant le redimensionnement\n    document.addEventListener('selectstart', (e) => {\n      if (isResizing) {\n        e.preventDefault();\n      }\n    });\n\n    function formatRGBA(color) {\n      if (!color) return '#ccc'; // Couleur par défaut si non définie\n      const r = Math.round(color.r * 255);\n      const g = Math.round(color.g * 255);\n      const b = Math.round(color.b * 255);\n      const a = color.a === undefined ? 1 : color.a;\n      return `rgba(${r}, ${g}, ${b}, ${a})`;\n    }\n\n    // Icônes SVG pour les types de variables\n    const variableTypeIcons = {\n      \"COLOR\": '<svg viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M7.312 6.803C8.64423 5.60135 10.387 4.9571 12.1805 5.00325C13.974 5.0494 15.6813 5.78243 16.95 7.051L17.23 7.349C18.4495 8.72011 19.0819 10.5153 18.991 12.348L18.962 12.728C18.807 14.222 17.446 15.002 16.242 15.002H13.5C13.3674 15.002 13.2402 15.0547 13.1464 15.1484C13.0527 15.2422 13 15.3694 13 15.502V16C13 16.82 12.66 17.603 12.08 18.127C11.478 18.669 10.612 18.927 9.71 18.617C8.589 18.2286 7.58506 17.5617 6.79244 16.6789C5.99981 15.7962 5.44448 14.7265 5.17857 13.5703C4.91266 12.4141 4.94489 11.2093 5.27224 10.0689C5.59958 8.92858 6.21131 7.89012 7.05 7.051L7.3 catch (_) {\n        return { search: filterMemory.search, types: [...filterMemory.types], origins: [...filterMemory.origins] };\n      }\n    }\n    function setFilterState(filter) {\n      filterMemory = { search: filter.search, types: [...filter.types], origins: [...filter.origins] };\n      try {\n        localStorage.setItem(SEARCH_KEY, filter.search);\n        localStorage.setItem(FILTER_TYPES_KEY, JSON.stringify(filter.types));\n        localStorage.setItem(FILTER_ORIGINS_KEY, JSON.stringify(filter.origins));\n      } catch (_) { /* no-op */ }\n    }\n\n    function escapeHtml(s) {\n      return String(s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n    }\n\n    // Cache du dernier message render pour re-render après toggle sort/filter\n    let lastRender = null;\n    let filtersExpanded = false;\n\n    // Singleton: pill actuellement ouvert (single-open semantics)\n    let openPathBox = null;\n\n    // Construit le breadcrumb du chemin de résolution d'une variable\n    function buildPathBreadcrumb(path) {\n      const root = document.createElement('div');\n      root.className = 'path-content';\n      const parts = [];\n      if (path.library) parts.push(path.library);\n      parts.push(path.collection);\n      for (const g of path.groups) parts.push(g);\n      parts.push(path.name);\n      root.textContent = '└─ ' + parts.join(' / ');\n      if (path.isAlias) {\n        const aliasTag = document.createElement('span');\n        aliasTag.className = 'alias-tag';\n        aliasTag.textContent = ' (alias)';\n        root.appendChild(aliasTag);\n      }\n      return root;\n    }\n\n    // Fonction pour créer le pill d'une variable (avec wrapper pour breadcrumb path)\n    function createVariablePill(item) {\n      const wrapper = document.createElement('div');\n      wrapper.className = 'pill-wrapper';\n\n      const pill = document.createElement(\"span\");\n      pill.className = `variable-pill ${item.origin}-variable`;\n      pill.style.cursor = item.path ? 'pointer' : 'default';\n\n      // Color swatch pour les variables COLOR\n      if (item.type === 'COLOR' && item.colorValue) {\n        const swatch = document.createElement('span');\n        swatch.className = 'color-swatch';\n        swatch.style.backgroundColor = formatRGBA(item.colorValue);\n        pill.appendChild(swatch);\n      }\n\n      // Ajouter l'icône de type de variable\n      const typeIcon = createVariableTypeIconElement(item.type);\n      if (typeIcon) {\n        pill.appendChild(typeIcon);\n      }\n\n      // Ajouter le nom de la variable\n      const nameSpan = document.createElement(\"span\");\n      nameSpan.textContent = item.name;\n      pill.appendChild(nameSpan);\n\n      wrapper.appendChild(pill);\n\n      if (item.path) {\n        const pathBox = document.createElement('div');\n        pathBox.className = 'variable-path';\n        pathBox.style.display = 'none';\n        pathBox.appendChild(buildPathBreadcrumb(item.path));\n        wrapper.appendChild(pathBox);\n\n        pill.addEventListener('click', () => {\n          const isOpen = pathBox.style.display === 'block';\n          if (openPathBox && openPathBox !== pathBox) {\n            openPathBox.style.display = 'none';\n          }\n          pathBox.style.display = isOpen ? 'none' : 'block';\n          openPathBox = isOpen ? null : pathBox;\n        });\n      }\n\n      return wrapper;\n    }\n\n    // Fonction pour créer un élément d'icône de propriété à partir de propertyIcons (réutilisable)\n    function createPropertyIcon(propertyName) {\n      const svg = propertyIcons[propertyName];\n      if (!svg) return null;\n      const span = document.createElement('span');\n      span.className = 'property-icon';\n      span.innerHTML = svg;\n      return span;\n    }\n\n    // Fonction pour créer un élément de propriété avec icône\n    function createPropertyElement(property) {\n      const container = document.createElement(\"div\");\n      container.className = \"title-property-container\";\n\n      // Ajouter l'icône de propriété\n      const propertyIcon = createPropertyIcon(property);\n      if (propertyIcon) {\n        container.appendChild(propertyIcon);\n      }\n\n      // Ajouter le nom de la propriété\n      const propertyName = document.createElement(\"span\");\n      propertyName.className = \"property-name\";\n      propertyName.textContent = property;\n      container.appendChild(propertyName);\n\n      return container;\n    }\n\n    // Fonction pour grouper les propriétés similaires\n    function groupSimilarProperties(items) {\n      const result = [];\n      const processed = new Set();\n\n      // Effets : regrouper par type d'effet\n      const effectPattern = /^(Drop Shadow|Inner Shadow|Background Blur|Layer Blur) (.+)$/;\n      const effectGroups = {};\n      items.forEach(item => {\n        const m = item.property.match(effectPattern);\n        if (m) {\n          const [, effectType, subName] = m;\n          if (!effectGroups[effectType]) effectGroups[effectType] = [];\n          effectGroups[effectType].push({ ...item, subName });\n          processed.add(item);\n        }\n      });\n      for (const [effectType, props] of Object.entries(effectGroups)) {\n        result.push({\n          isGroup: true,\n          groupName: effectType,\n          properties: props\n        });\n      }\n\n      // Groupes potentiels et leurs préfixes\n      const groups = [\n        {\n          prefix: \"Radius\",\n          pattern: /^(Top|Bottom) (Left|Right) Radius$/,\n          extractSubName: (prop) => prop.replace(\" Radius\", \"\"),\n          groupName: \"Radius\"\n        },\n        {\n          prefix: \"Stroke Weight\",\n          pattern: /^Stroke (Top|Bottom|Left|Right) Weight$/,\n          extractSubName: (prop) => prop.replace(\"Stroke \", \"\").replace(\" Weight\", \"\"),\n          groupName: \"Stroke Weight\"\n        },\n        {\n          prefix: \"Padding\",\n          pattern: /^Padding (Top|Bottom|Left|Right)$/,\n          extractSubName: (prop) => prop.replace(\"Padding \", \"\"),\n          groupName: \"Padding\"\n        }\n      ];\n\n      // Chercher les groupes potentiels\n      for (const group of groups) {\n        const matchingProps = items.filter(item =>\n          group.pattern.test(item.property) && !processed.has(item)\n        );\n\n        if (matchingProps.length > 1) {\n          // Créer un groupe\n          result.push({\n            isGroup: true,\n            groupName: group.groupName,\n            properties: matchingProps.map(prop => ({\n              ...prop,\n              subName: group.extractSubName(prop.property)\n            }))\n          });\n\n          // Marquer ces propriétés comme traitées\n          matchingProps.forEach(p => processed.add(p));\n        }\n      }\n\n      // Ajouter les propriétés restantes non groupées\n      for (const item of items) {\n        if (!processed.has(item)) {\n          result.push(item);\n        }\n      }\n\n      return result;\n    }\n\n    // Fonction pour grouper les propriétés non liées similaires\n    function groupSimilarUnboundProperties(items) {\n      const result = [];\n      const processed = new Set();\n      // Effets non liés : regrouper par type d'effet\n      const effectPattern = /^(Drop Shadow|Inner Shadow|Background Blur|Layer Blur) (.+)$/;\n      const effectGroups = {};\n      items.forEach(item => {\n        const m = item.property.match(effectPattern);\n        if (m) {\n          const [, effectType, subName] = m;\n          if (!effectGroups[effectType]) effectGroups[effectType] = [];\n          effectGroups[effectType].push({ ...item, subName });\n          processed.add(item);\n        }\n      });\n      for (const [effectType, props] of Object.entries(effectGroups)) {\n        result.push({\n          isGroup: true,\n          groupName: effectType,\n          properties: props\n        });\n      }\n      // Groupes potentiels et leurs préfixes\n      const groups = [\n        {\n          prefix: \"Radius\",\n          pattern: /^(Top|Bottom) (Left|Right) Radius$/,\n          extractSubName: (prop) => prop.replace(\" Radius\", \"\"),\n          groupName: \"Radius\"\n        },\n        {\n          prefix: \"Stroke Weight\",\n          pattern: /^Stroke (Top|Bottom|Left|Right) Weight$/,\n          extractSubName: (prop) => prop.replace(\"Stroke \", \"\").replace(\" Weight\", \"\"),\n          groupName: \"Stroke Weight\"\n        },\n        {\n          prefix: \"Padding\",\n          pattern: /^Padding (Top|Bottom|Left|Right)$/,\n          extractSubName: (prop) => prop.replace(\"Padding \", \"\"),\n          groupName: \"Padding\"\n        }\n      ];\n\n      // Chercher les groupes potentiels\n      for (const group of groups) {\n        const matchingProps = items.filter(item =>\n          group.pattern.test(item.property) && !processed.has(item)\n        );\n\n        if (matchingProps.length > 1) {\n          // Créer un groupe\n          result.push({\n            isGroup: true,\n            groupName: group.groupName,\n            properties: matchingProps.map(prop => ({\n              ...prop,\n              subName: group.extractSubName(prop.property)\n            }))\n          });\n\n          // Marquer ces propriétés comme traitées\n          matchingProps.forEach(p => processed.add(p));\n        }\n      }\n\n      // Ajouter les propriétés restantes non groupées\n      for (const item of items) {\n        if (!processed.has(item)) {\n          result.push(item);\n        }\n      }\n\n      return result;\n    }\n\n    // Fonction pour rendre une liste d'éléments (groupés ou simples)\n    /**\n     * Splits an array of items (bound or unbound) into two arrays:\n     * those without an effectGroup (rendered normally) and those with one\n     * (rendered grouped). Mutates nothing; returns { normal, effectItems }.\n     */\n    function splitEffectsFromItems(items) {\n      const normal = [];\n      const effectItems = [];\n      for (const item of items || []) {\n        if (item && item.effectGroup) effectItems.push(item);\n        else normal.push(item);\n      }\n      return { normal, effectItems };\n    }\n\n    /**\n     * Builds a Map<effectGroup, { bound: [], unbound: [] }> grouping each\n     * effect's sub-props together. Insertion order = first appearance.\n     */\n    function groupEffectItems(boundEffects, unboundEffects) {\n      const groups = new Map();\n      const bucket = (key) => {\n        if (!groups.has(key)) groups.set(key, { bound: [], unbound: [] });\n        return groups.get(key);\n      };\n      for (const e of boundEffects) bucket(e.effectGroup).bound.push(e);\n      for (const u of unboundEffects) bucket(u.effectGroup).unbound.push(u);\n      return groups;\n    }\n\n    /**\n     * Sort sub-props in a logical order: Radius/Blur first, then Offset X/Y,\n     * then Spread, then Color. Anything else falls to the bottom alphabetically.\n     */\n    const SUBPROP_ORDER = ['Blur', 'Radius', 'Offset X', 'Offset Y', 'Spread', 'Color'];\n    function sortSubProps(items) {\n      return [...items].sort((a, b) => {\n        const ai = SUBPROP_ORDER.indexOf(a.subProp);\n        const bi = SUBPROP_ORDER.indexOf(b.subProp);\n        const ax = ai === -1 ? SUBPROP_ORDER.length : ai;\n        const bx = bi === -1 ? SUBPROP_ORDER.length : bi;\n        if (ax !== bx) return ax - bx;\n        return (a.subProp || '').localeCompare(b.subProp || '');\n      });\n    }\n\n    /**\n     * Returns the base type name from an effectGroup label.\n     * \"Drop Shadow 1\" → \"Drop Shadow\", \"Drop Shadow\" → \"Drop Shadow\".\n     * Used to look up the matching property icon (Drop Shadow / Inner Shadow / etc.).\n     */\n    function effectGroupBaseType(label) {\n      return label.replace(/ \\d+$/, '');\n    }\n\n    /**\n     * Renders one effect group as a property-group block matching the\n     * existing UI for grouped properties (property-group-title header +\n     * property-sub-list with property-container per sub-prop). Reuses the\n     * same DOM structure and classes as renderItemsList(isGroup) so the\n     * visual is consistent with the rest of the panel.\n     */\n    function renderEffectGroup(name, bound, unbound) {\n      const li = document.createElement('li');\n\n      const groupTitle = document.createElement('div');\n      groupTitle.className = 'property-group-title';\n      const icon = createPropertyIcon(effectGroupBaseType(name));\n      if (icon) groupTitle.appendChild(icon);\n      const titleText = document.createElement('span');\n      titleText.textContent = name;\n      groupTitle.appendChild(titleText);\n      li.appendChild(groupTitle);\n\n      const subList = document.createElement('ul');\n      subList.className = 'property-sub-list';\n\n      const sortedBound = sortSubProps(bound);\n      const sortedUnbound = sortSubProps(unbound);\n\n      for (const b of sortedBound) {\n        subList.appendChild(renderEffectSubPropRow(b.subProp || b.property, createVariablePill(b), false));\n      }\n      for (const u of sortedUnbound) {\n        const unboundPill = document.createElement('span');\n        unboundPill.className = 'variable-pill unbound-variable';\n        const valueSpan = document.createElement('span');\n        valueSpan.textContent = u.value;\n        unboundPill.appendChild(valueSpan);\n        subList.appendChild(renderEffectSubPropRow(u.subProp || u.property, unboundPill, true));\n      }\n\n      li.appendChild(subList);\n      return li;\n    }\n\n    function renderEffectSubPropRow(label, valueEl, _danger) {\n      const subLi = document.createElement('li');\n      const propContainer = document.createElement('div');\n      // Match the renderItemsList(isGroup) layout exactly: no .danger on the\n      // container so the row keeps the neutral spacing; the pill itself\n      // (variable-pill unbound-variable) carries the red palette and warning\n      // icon via .unbound-variable::before.\n      propContainer.className = 'property-container';\n      propContainer.appendChild(createPropertyElement(label));\n      propContainer.appendChild(valueEl);\n      subLi.appendChild(propContainer);\n      return subLi;\n    }\n\n    /**\n     * Renders all effect groups for one layer as a single <ul> matching the\n     * outer panel structure. Returns null if nothing to render.\n     */\n    function renderEffectGroupsSection(boundEffects, unboundEffects) {\n      if (boundEffects.length === 0 && unboundEffects.length === 0) return null;\n      const ul = document.createElement('ul');\n      const groups = groupEffectItems(boundEffects, unboundEffects);\n      for (const [groupName, { bound, unbound }] of groups) {\n        ul.appendChild(renderEffectGroup(groupName, bound, unbound));\n      }\n      return ul;\n    }\n\n    function renderItemsList(items, isUnbound = false) {\n      const ul = document.createElement(\"ul\");\n\n      for (const item of items) {\n        const li = document.createElement(\"li\");\n\n        // Si c'est un groupe de propriétés\n        if (item.isGroup) {\n          // Titre du groupe\n          const groupTitle = document.createElement(\"div\");\n          groupTitle.className = \"property-group-title\";\n          const icon = createPropertyIcon(item.groupName);\n          if (icon) {\n            groupTitle.appendChild(icon);\n          }\n          const titleText = document.createElement(\"span\");\n          titleText.textContent = item.groupName;\n          groupTitle.appendChild(titleText);\n\n          li.appendChild(groupTitle);\n\n          // Liste des sous-propriétés\n          const subList = document.createElement(\"ul\");\n          subList.className = \"property-sub-list\";\n\n          for (const subItem of item.properties) {\n            const subLi = document.createElement(\"li\");\n\n            // Conteneur pour la propriété\n            const propContainer = document.createElement(\"div\");\n            propContainer.className = \"property-container\";\n\n            // Conteneur pour la propriété avec son icône\n            const propertyContainer = createPropertyElement(subItem.subName);\n            propContainer.appendChild(propertyContainer);\n\n            if (isUnbound) {\n              // Pour les propriétés non liées, créer un élément qui ressemble à une pill\n              const unboundPill = document.createElement(\"span\");\n              unboundPill.className = \"variable-pill unbound-variable\";\n\n\n              // Ajouter la valeur\n              const valueSpan = document.createElement(\"span\");\n              valueSpan.textContent = subItem.value;\n              unboundPill.appendChild(valueSpan);\n\n              propContainer.appendChild(unboundPill);\n            } else {\n              // Pill de la variable pour les éléments liés\n              const pill = createVariablePill(subItem);\n              pill.className = pill.className;\n              propContainer.appendChild(pill);\n            }\n\n            subLi.appendChild(propContainer);\n            subList.appendChild(subLi);\n          }\n\n          li.appendChild(subList);\n        } else {\n          // Propriété simple (groupée ou non)\n          const propContainer = document.createElement(\"div\");\n          propContainer.className = \"property-container\";\n\n          // Conteneur pour la propriété avec son icône\n          const propertyContainer = createPropertyElement(item.property);\n          propContainer.appendChild(propertyContainer);\n\n          if (isUnbound) {\n            // Pour les propriétés non liées, créer un élément qui ressemble à une pill\n            const unboundPill = document.createElement(\"span\");\n            unboundPill.className = \"variable-pill unbound-variable\";\n\n            // Ajouter la valeur\n            const valueSpan = document.createElement(\"span\");\n            valueSpan.textContent = item.value;\n            unboundPill.appendChild(valueSpan);\n\n            unboundPill.className = unboundPill.className;\n            propContainer.appendChild(unboundPill);\n          } else {\n            // Pill de la variable pour les éléments liés\n            const pill = createVariablePill(item);\n            pill.className = pill.className;\n            propContainer.appendChild(pill);\n          }\n\n          li.appendChild(propContainer);\n        }\n\n        ul.appendChild(li);\n      }\n\n      return ul;\n    }\n\n    // Construit la toolbar (rescan + search + sort toggle + filter chips).\n    // Toutes les actions re-invoquent handlePluginMessage(lastRender) sans\n    // re-scan plugin-side, sauf le rescan (⟳) qui poste 'rescan'.\n    function renderToolbar() {\n      const toolbar = document.createElement('div');\n      toolbar.className = 'toolbar';\n      const filter = getFilterState();\n      const activeFilterCount = filter.types.length + filter.origins.length;\n      const expanded = filtersExpanded;\n      toolbar.innerHTML = `\n        <div class=\"toolbar-row\">\n          <input class=\"fg-search\" type=\"text\" placeholder=\"Rechercher\" value=\"${escapeHtml(filter.search)}\" />\n          <button class=\"fg-ghost fg-rescan\" title=\"Re-scan selection\" aria-label=\"Re-scan\">\n            <svg viewBox=\"0 0 24 24\"><path d=\"M23 4v6h-6\"/><path d=\"M20.49 15a9 9 0 1 1-2.12-9.36L23 10\"/></svg>\n          </button>\n        </div>\n        <div class=\"toolbar-row\">\n          <div class=\"fg-seg\">\n            <button data-mode=\"byLayer\">Calque</button>\n            <button data-mode=\"byProperty\">Propriété</button>\n            <button data-mode=\"unbound\">Unbound</button>\n          </div>\n          <span style=\"flex:1\"></span>\n          <button class=\"fg-filter-btn\" data-expanded=\"${expanded ? 'true' : 'false'}\" aria-expanded=\"${expanded ? 'true' : 'false'}\">\n            Filtres${activeFilterCount > 0 ? ` <span class=\"fg-badge\">${activeFilterCount}</span>` : ''}\n            <svg class=\"fg-caret\" viewBox=\"0 0 24 24\"><polyline points=\"6 9 12 15 18 9\"/></svg>\n          </button>\n        </div>\n        ${expanded ? `\n        <div class=\"fg-filters\">\n          <div class=\"fg-frow\">\n            <span class=\"fg-flabel\">Type</span>\n            <button class=\"fg-chip\" data-filter=\"type\" data-value=\"COLOR\">Color</button>\n            <button class=\"fg-chip\" data-filter=\"type\" data-value=\"FLOAT\">Float</button>\n            <button class=\"fg-chip\" data-filter=\"type\" data-value=\"STRING\">String</button>\n            <button class=\"fg-chip\" data-filter=\"type\" data-value=\"BOOLEAN\">Bool</button>\n          </div>\n          <div class=\"fg-frow\">\n            <span class=\"fg-flabel\">Origine</span>\n            <button class=\"fg-chip\" data-filter=\"origin\" data-value=\"local\">Local</button>\n            <button class=\"fg-chip\" data-filter=\"origin\" data-value=\"external\">External</button>\n          </div>\n        </div>` : ''}\n      `;\n\n      toolbar.querySelector('.fg-rescan').addEventListener('click', () => {\n        parent.postMessage({ pluginMessage: { type: 'rescan' } }, '*');\n      });\n\n      const currentSort = getSortMode();\n      toolbar.querySelectorAll('.fg-seg button').forEach(btn => {\n        if (btn.dataset.mode === currentSort) btn.classList.add('active');\n        btn.addEventListener('click', () => {\n          if (btn.dataset.mode === getSortMode()) return;\n          setSortMode(btn.dataset.mode);\n          if (lastRender) handlePluginMessage(lastRender);\n        });\n      });\n\n      toolbar.querySelector('.fg-filter-btn').addEventListener('click', () => {\n        filtersExpanded = !filtersExpanded;\n        if (lastRender) handlePluginMessage(lastRender);\n      });\n\n      toolbar.querySelectorAll('.fg-chip').forEach(chip => {\n        const f = chip.dataset.filter;\n        const v = chip.dataset.value;\n        const arr = f === 'type' ? filter.types : filter.origins;\n        if (arr.includes(v)) chip.classList.add('active');\n        chip.addEventListener('click', () => {\n          const cur = getFilterState();\n          const target = f === 'type' ? cur.types : cur.origins;\n          const idx = target.indexOf(v);\n          if (idx >= 0) target.splice(idx, 1); else target.push(v);\n          setFilterState(cur);\n          if (lastRender) handlePluginMessage(lastRender);\n        });\n      });\n\n      let searchTimer = null;\n      const searchInput = toolbar.querySelector('.fg-search');\n      searchInput.addEventListener('input', (ev) => {\n        if (searchTimer) clearTimeout(searchTimer);\n        searchTimer = setTimeout(() => {\n          const cur = getFilterState();\n          cur.search = ev.target.value;\n          setFilterState(cur);\n          if (lastRender) handlePluginMessage(lastRender);\n        }, 150);\n      });\n\n      return toolbar;\n    }\n\n    // Applique le filter state (search + types + origins) à une entrée bound.\n    function matchesFilter(entry, filter) {\n      const q = (filter.search || '').trim().toLowerCase();\n      if (q) {\n        const hay = `${entry.layer || ''} ${entry.property || ''} ${entry.name || ''}`.toLowerCase();\n        if (!hay.includes(q)) return false;\n      }\n      if (filter.types.length > 0 && !filter.types.includes(entry.type)) return false;\n      if (filter.origins.length > 0 && !filter.origins.includes(entry.origin)) return false;\n      return true;\n    }\n\n    // Applique le filter state à une entry unbound. Les unbound n'ont pas de\n    // type/origin (toujours hardcodé) — on ne filtre que par search sur layer\n    // + property + value. Les chips type/origin actifs masquent les unbound.\n    function matchesFilterUnbound(layer, item, filter) {\n      if (filter.types.length > 0 || filter.origins.length > 0) return false;\n      const q = (filter.search || '').trim().toLowerCase();\n      if (!q) return true;\n      const hay = `${layer || ''} ${item.property || ''} ${String(item.value || '')}`.toLowerCase();\n      return hay.includes(q);\n    }\n\n    // Filtre byLayer + unboundMap en place et retourne de nouveaux objets.\n    function applyFilters(byLayer, unboundMap, filter) {\n      const fByLayer = {};\n      for (const k of Object.keys(byLayer || {})) {\n        const kept = (byLayer[k] || []).filter(e => matchesFilter(e, filter));\n        if (kept.length > 0) fByLayer[k] = kept;\n      }\n      const fUnbound = {};\n      for (const layer of Object.keys(unboundMap || {})) {\n        const kept = (unboundMap[layer] || []).filter(it => matchesFilterUnbound(layer, it, filter));\n        if (kept.length > 0) fUnbound[layer] = kept;\n      }\n      return { byLayer: fByLayer, unboundMap: fUnbound };\n    }\n\n    // Construit le dashboard de stats affiché au-dessus des layer-sections\n    function renderStats(stats) {\n      const dashboard = document.createElement('div');\n      dashboard.className = 'stats-dashboard';\n      const coveragePct = Math.round(stats.variableCoverage * 100);\n      dashboard.innerHTML = `\n        <div class=\"stats-line\">\n          <strong>${stats.totalVariables}</strong> variables\n          • <strong>${stats.totalHardcoded}</strong> hardcoded (${100 - coveragePct}%)\n        </div>\n        <div class=\"stats-line\">\n          <strong>${stats.byOrigin.local}</strong> local • <strong>${stats.byOrigin.external}</strong> external\n        </div>\n        <div class=\"stats-bar\">\n          <div class=\"stats-bar-fill\" style=\"width: ${coveragePct}%\"></div>\n          <span class=\"stats-bar-label\">Coverage : ${coveragePct}%</span>\n        </div>\n      `;\n      return dashboard;\n    }\n\n    // Rendu alternatif \"Par propriété\" : flatten bound entries across layers,\n    // groupe par property name, rend chaque property en section flat avec\n    // rows \"[layer] → [pill]\". Mixes bound + unbound entries under the same\n    // property heading — pill style (.variable-pill vs .unbound-variable)\n    // is the only visual differentiator. No more separate .danger section.\n    function renderByPropertyMode(container, msg, unboundMap) {\n      const { byLayer, layerInfoMap } = msg;\n\n      // Build a single property → entries map mixing bound + unbound.\n      // Each entry is { kind: 'bound' | 'unbound', ...payload }. Stable order:\n      // bound first (in original byLayer order), then unbound.\n      const byProp = {};\n      const propKey = (effectGroup, subProp, property) =>\n        effectGroup ? `${effectGroup} / ${subProp || property}` : property;\n\n      for (const layerKey of Object.keys(byLayer || {})) {\n        for (const entry of byLayer[layerKey] || []) {\n          const key = propKey(entry.effectGroup, entry.subProp, entry.property);\n          if (!byProp[key]) byProp[key] = [];\n          byProp[key].push({ kind: 'bound', entry });\n        }\n      }\n      for (const layerName of Object.keys(unboundMap || {})) {\n        for (const u of unboundMap[layerName] || []) {\n          const key = propKey(u.effectGroup, u.subProp, u.property);\n          if (!byProp[key]) byProp[key] = [];\n          byProp[key].push({ kind: 'unbound', entry: { ...u, layer: layerName } });\n        }\n      }\n\n      const propNames = Object.keys(byProp).sort();\n      if (propNames.length === 0) {\n        const empty = document.createElement('div');\n        empty.style.padding = '2rem';\n        empty.style.textAlign = 'center';\n        empty.style.color = 'var(--fg-text-secondary)';\n        empty.textContent = 'Aucune propriété à afficher.';\n        container.appendChild(empty);\n        return;\n      }\n\n      for (const prop of propNames) {\n        const section = document.createElement('div');\n        section.className = 'property-section';\n        const h = document.createElement('h2');\n        h.textContent = `${prop} (${byProp[prop].length})`;\n        section.appendChild(h);\n        for (const row of byProp[prop]) {\n          const rowEl = document.createElement('div');\n          rowEl.className = 'property-row';\n\n          const layerLabel = document.createElement('span');\n          layerLabel.className = 'property-row-layer';\n          let layerId = '';\n          let layerText = '';\n          if (row.kind === 'bound') {\n            layerId = row.entry.layerId;\n            const li = layerInfoMap && layerInfoMap[layerId];\n            layerText = (li && li.name) || row.entry.layer;\n          } else {\n            layerText = row.entry.layer;\n            // Unbound entries don't carry layerId in unboundMap — resolve via\n            // first layerInfoMap entry whose name matches (best-effort).\n            if (layerInfoMap) {\n              for (const [id, info] of Object.entries(layerInfoMap)) {\n                if (info.name === layerText) { layerId = id; break; }\n              }\n            }\n          }\n          layerLabel.textContent = layerText;\n          if (layerId) {\n            layerLabel.style.cursor = 'pointer';\n            layerLabel.addEventListener('click', () => {\n              parent.postMessage({ pluginMessage: { type: 'select-node', nodeId: layerId } }, '*');\n            });\n          }\n          rowEl.appendChild(layerLabel);\n          rowEl.appendChild(document.createTextNode(' → '));\n\n          if (row.kind === 'bound') {\n            rowEl.appendChild(createVariablePill(row.entry));\n          } else {\n            const pill = document.createElement('span');\n            pill.className = 'variable-pill unbound-variable';\n            const v = document.createElement('span');\n            v.textContent = String(row.entry.value);\n            pill.appendChild(v);\n            rowEl.appendChild(pill);\n          }\n          section.appendChild(rowEl);\n        }\n        container.appendChild(section);\n      }\n    }\n\n    function handlePluginMessage(msg) {\n      if (!msg) return;\n\n      // Scan-start : ajoute la classe .scanning au bouton rescan pour\n      // afficher le spinner. Ne touche pas au reste du DOM — le contenu\n      // précédent reste affiché pendant le scan.\n      if (msg.type === 'scan-start') {\n        document.querySelectorAll('.fg-rescan').forEach(b => b.classList.add('scanning'));\n        return;\n      }\n\n      if (msg.type === 'error') {\n        const container = document.getElementById(\"app\");\n        container.innerHTML = `<div style=\"padding:1rem;color:#b00;\">Erreur: ${msg.message || 'inconnue'}</div>`;\n        return;\n      }\n\n      // Sélection trop large : afficher un état dédié avec un bouton\n      // \"Scanner quand même\" qui bypasse le cap MAX_SCAN_NODES.\n      if (msg.type === 'too-large') {\n        document.querySelectorAll('.fg-rescan').forEach(b => b.classList.remove('scanning'));\n        const container = document.getElementById(\"app\");\n        container.innerHTML = '';\n        const box = document.createElement('div');\n        box.style.cssText = 'padding:1.5rem;text-align:center;color:#666;';\n        const safeCount = Number(msg.nodeCount) || 0;\n        const safeLimit = Number(msg.limit) || 0;\n        const title = document.createElement('h3');\n        title.style.cssText = 'margin-bottom:0.5rem;color:#b87a00;';\n        title.textContent = 'Sélection trop grande';\n        const explain = document.createElement('p');\n        explain.style.cssText = 'margin-bottom:1rem;font-size:12px;';\n        explain.textContent = `${safeCount.toLocaleString('fr-FR')} nœuds détectés (limite : ${safeLimit.toLocaleString('fr-FR')}). Réduisez la sélection ou forcez le scan ci-dessous.`;\n        const btn = document.createElement('button');\n        btn.className = 'fg-rescan';\n        btn.style.cssText = 'padding:0.5rem 1rem;cursor:pointer;';\n        btn.textContent = 'Scanner quand même';\n        btn.addEventListener('click', () => {\n          btn.disabled = true;\n          parent.postMessage({ pluginMessage: { type: 'force-scan' } }, '*');\n        });\n        box.appendChild(title);\n        box.appendChild(explain);\n        box.appendChild(btn);\n        container.appendChild(box);\n        return;\n      }\n\n      lastRender = msg;\n      let { byLayer, unbound, layerInfoMap, instancesByName, stats, noVariablesFound } = msg;\n      // Dedup unbound entries within each layer name by\n      // (effectGroup, subProp, property, value) tuple. Multiple identical\n      // instances of a component (whether or not the plugin merged them via\n      // fingerprint) produce N copies of the same hardcoded property — show\n      // them once.\n      let unboundMap = {};\n      if (unbound) {\n        const unboundSeen = {};\n        unbound.forEach(({ layer, property, value, effectGroup, subProp }) => {\n          if (!unboundMap[layer]) {\n            unboundMap[layer] = [];\n            unboundSeen[layer] = new Set();\n          }\n          const key = `${effectGroup || ''}|${subProp || ''}|${property}|${value}`;\n          if (unboundSeen[layer].has(key)) return;\n          unboundSeen[layer].add(key);\n          unboundMap[layer].push({ property, value, effectGroup, subProp });\n        });\n      }\n      const container = document.getElementById(\"app\");\n\n      // Préserver focus + caret de l'input de recherche pendant le re-render.\n      // Sans ça, taper dans le search perd le focus à chaque debounce-fire\n      // (innerHTML=\"\" détruit l'input, le nouveau démarre sans focus).\n      let restoreSearch = null;\n      const activeEl = document.activeElement;\n      if (activeEl && activeEl.classList && activeEl.classList.contains('fg-search')) {\n        restoreSearch = {\n          start: activeEl.selectionStart,\n          end: activeEl.selectionEnd,\n        };\n      }\n\n      container.innerHTML = \"\";\n\n      // Toolbar (rescan button + futurs controls) — toujours rendu, même\n      // sur empty state, pour permettre à l'utilisateur de relancer un scan.\n      container.appendChild(renderToolbar());\n\n      if (restoreSearch) {\n        const newSearch = container.querySelector('.fg-search');\n        if (newSearch) {\n          newSearch.focus();\n          try { newSearch.setSelectionRange(restoreSearch.start, restoreSearch.end); } catch (_) { /* no-op */ }\n        }\n      }\n\n      // Vérifier s'il n'y a aucune variable ni propriété non liée\n      if (noVariablesFound) {\n        const emptyMessage = document.createElement(\"div\");\n        emptyMessage.style.padding = \"2rem\";\n        emptyMessage.style.textAlign = \"center\";\n        emptyMessage.style.color = \"#666\";\n        emptyMessage.innerHTML = `\n          <h3 style=\"margin-bottom: 1rem;\">Aucune propriété détectée</h3>\n          <p>La sélection actuelle ne contient aucune propriété détectable.</p>\n          <p>Sélectionnez un élément avec des propriétés à inspecter.</p>\n        `;\n        container.appendChild(emptyMessage);\n        return;\n      }\n\n      // Dashboard de stats en tête de panneau (avant la liste des calques)\n      if (stats) {\n        container.appendChild(renderStats(stats));\n      }\n\n      // Applique search + filter chips avant tout rendu. Le state filter\n      // est lu une fois par render pour stabilité (sinon double-eval).\n      const filterState = getFilterState();\n      const filtered = applyFilters(byLayer, unboundMap, filterState);\n      byLayer = filtered.byLayer;\n      unboundMap = filtered.unboundMap;\n\n      const hasFilter = filterState.search.trim().length > 0\n        || filterState.types.length > 0\n        || filterState.origins.length > 0;\n      const noMatch = hasFilter\n        && Object.keys(byLayer).length === 0\n        && Object.keys(unboundMap).length === 0;\n      if (noMatch) {\n        const empty = document.createElement('p');\n        empty.className = 'empty-state';\n        empty.style.cssText = 'padding:1rem;text-align:center;color:#666;';\n        empty.textContent = 'Aucun résultat ne correspond aux filtres.';\n        container.appendChild(empty);\n        return;\n      }\n\n      // Sort mode dispatch :\n      //  - 'unbound'    : layout byLayer mais sans les bound (byLayer = {})\n      //  - 'byProperty' : layout flat par property (bound + unbound mélangés)\n      //  - 'byLayer'    : flow historique ci-dessous (bound + unbound par calque)\n      const mode = getSortMode();\n      if (mode === 'unbound') {\n        byLayer = {};\n        // fall through to byLayer rendering loop; unboundMap drives layer-sections\n      } else if (mode === 'byProperty') {\n        renderByPropertyMode(container, { ...msg, byLayer }, unboundMap);\n        return;\n      }\n\n      // Prépare les informations pour l'affichage\n      // Combiner les infos des calques qui ont des variables et des calques qui ont des propriétés non variabilisées\n      const allLayerNames = new Set([\n        ...Object.keys(byLayer || {}),\n        ...Object.keys(unboundMap || {})\n      ]);\n\n      // Structure pour stocker toutes les infos des calques avec leur ordre\n      const allLayersWithOrderInfo = [];\n\n      // Pour chaque calque qui a des variables liées ou non liées\n      for (const layerName of allLayerNames) {\n        // Chercher l'ID du calque et son info d'ordre\n        let layerId = '';\n        let orderInfo = null;\n\n        // D'abord, essayer de trouver l'ID via les variables liées\n        if (byLayer && byLayer[layerName] && byLayer[layerName].length > 0) {\n          layerId = byLayer[layerName][0].layerId;\n          orderInfo = layerInfoMap[layerId];\n\n          // Déduplication des propriétés de remplissage\n          // Si un calque a à la fois \"Fill\" et \"fills.0\", ne garder que \"Fill\"\n          const items = byLayer[layerName];\n          const dedupedItems = [];\n          const seenProps = new Set();\n\n          for (const item of items) {\n            // Si la propriété est \"fills.0\" ou commence par \"fills.\", la renommer en \"Fill\"\n            let propName = item.property;\n            if (propName === \"fills.0\" || propName.startsWith(\"fills.\")) {\n              propName = \"Fill\";\n            }\n\n            // Créer une clé de déduplication\n            const dedupKey = `${propName}|${item.name}`;\n\n            // Ne pas ajouter si on a déjà vu cette propriété\n            if (!seenProps.has(dedupKey)) {\n              seenProps.add(dedupKey);\n              dedupedItems.push({ ...item, property: propName });\n            }\n          }\n\n          // Remplacer les items par les items dédupliqués\n          byLayer[layerName] = dedupedItems;\n        }\n\n        // Si nous n'avons pas trouvé l'ID/ordre, parcourir tous les layerInfoMap pour trouver le calque par son nom\n        if (!orderInfo) {\n          for (const [id, info] of Object.entries(layerInfoMap)) {\n            if (info.name === layerName) {\n              layerId = id;\n              orderInfo = info;\n              break;\n            }\n          }\n        }\n\n        // Ajouter ce calque avec son info d'ordre\n        allLayersWithOrderInfo.push({\n          layerName: layerName,\n          // Éléments liés à des variables (peut être vide)\n          items: (byLayer && byLayer[layerName]) || [],\n          // Propriétés non liées (peut être vide)\n          unboundItems: (unboundMap && unboundMap[layerName]) || [],\n          // Info d'ordre pour trier\n          order: orderInfo ? orderInfo.order : Number.MAX_SAFE_INTEGER,\n          layerId: layerId\n        });\n      }\n\n      // Trier tous les calques selon l'ordre de Figma\n      allLayersWithOrderInfo.sort((a, b) => a.order - b.order);\n\n      // Virtualisation progressive — sur grosse sélection (>50 sections), on\n      // ne pose dans le DOM que les VIRT_INITIAL premières sections puis on\n      // ajoute les suivantes par lots de VIRT_BATCH dès qu'un sentinel placé\n      // en bas de liste devient visible. Garde l'UI fluide sur des panels de\n      // plusieurs milliers de calques.\n      const VIRT_INITIAL = 50;\n      const VIRT_BATCH = 30;\n      const renderableLayers = allLayersWithOrderInfo.filter(\n        l => (l.items && l.items.length > 0) || (l.unboundItems && l.unboundItems.length > 0)\n      );\n\n      const buildSection = ({ layerName, items, unboundItems, layerId }) => {\n        {\n          const section = document.createElement(\"div\");\n          section.className = \"layer-section\";\n\n          // Créer header contenant titre et icône de sélection\n          const header = document.createElement(\"div\");\n          header.className = \"layer-header\";\n          const hcontent = document.createElement(\"div\");\n          hcontent.className = \"layer-header-content\";\n          header.appendChild(hcontent);\n          // Récupérer info de calque pour le type\n          const layerInfo = layerInfoMap[layerId];\n          const layerType = layerInfo ? layerInfo.type : 'UNKNOWN';\n\n          // Icône de type de calque (à gauche du titre)\n          const typeIcon = createLayerTypeIconElement(layerType);\n          if (typeIcon) {\n            hcontent.appendChild(typeIcon);\n          }\n\n          // Titre du calque\n          const title = document.createElement(\"h2\");\n          title.textContent = (layerInfo && layerInfo.name) ? layerInfo.name : layerName;\n          hcontent.appendChild(title);\n\n          // Badge × N : prend les IDs du fingerprint-merge (layerInfo.mergedNodeIds)\n          // s'il existe, sinon retombe sur instancesByName[displayName] — qui\n          // compte les INSTANCE nodes partageant le même nom même quand leurs\n          // fingerprints diffèrent (boundVars/variants/copies).\n          const displayName = (layerInfo && layerInfo.name) ? layerInfo.name : layerName;\n          let cycleIds = (layerInfo && layerInfo.mergedNodeIds) || [];\n          if (cycleIds.length <= 1 && instancesByName && instancesByName[displayName]) {\n            cycleIds = instancesByName[displayName];\n          }\n          if (cycleIds.length > 1) {\n            const badge = document.createElement('span');\n            badge.className = 'merge-badge';\n            badge.textContent = `× ${cycleIds.length}`;\n            badge.title = 'Cliquer pour cycler entre les instances identiques';\n            badge.dataset.cycleIndex = '0';\n            badge.addEventListener('click', (ev) => {\n              ev.stopPropagation();\n              let idx = parseInt(badge.dataset.cycleIndex, 10) || 0;\n              parent.postMessage({ pluginMessage: { type: 'select-node', nodeId: cycleIds[idx] } }, '*');\n              idx = (idx + 1) % cycleIds.length;\n              badge.dataset.cycleIndex = String(idx);\n            });\n            hcontent.appendChild(badge);\n          }\n\n          // Icône de sélection (SVG simple, remplace facilement)\n          const selectIcon = document.createElement(\"span\");\n          selectIcon.className = \"select-icon\";\n          selectIcon.innerHTML = `\n            <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\">\n              <path fill-rule=\"evenodd\" clip-rule=\"evenodd\" d=\"M12 18.8571C13.8186 18.8571 15.5628 18.1347 16.8487 16.8487C18.1347 15.5628 18.8571 13.8186 18.8571 12C18.8571 10.1814 18.1347 8.43723 16.8487 7.15127C15.5628 5.8653 13.8186 5.14286 12 5.14286C10.1814 5.14286 8.43723 5.8653 7.15127 7.15127C5.8653 8.43723 5.14286 10.1814 5.14286 12C5.14286 13.8186 5.8653 15.5628 7.15127 16.8487C8.43723 18.1347 10.1814 18.8571 12 18.8571ZM12 20C13.0506 20 14.0909 19.7931 15.0615 19.391C16.0321 18.989 16.914 18.3997 17.6569 17.6569C18.3997 16.914 18.989 16.0321 19.391 15.0615C19.7931 14.0909 20 13.0506 20 12C20 10.9494 19.7931 9.90914 19.391 8.93853C18.989 7.96793 18.3997 7.08601 17.6569 6.34315C16.914 5.60028 16.0321 5.011 15.0615 4.60896C14.0909 4.2069 286 12C15.4286 12.9093 15.0673 13.7814 14.4244 14.4244C13.7814 15.0673 12.9093 15.4286 12 15.4286C11.0907 15.4286 10.2186 15.0673 9.57563 14.4244C8.93265 13.7814 8.57143 12.9093 8.57143 12C8.57143 11.0907 8.93265 10.2186 9.57563 9.57563C10.2186 8.93265 11.0907 8.57143 12 8.57143ZM12 8.67188C11.1172 8.67188 10.2707 9.02226 9.64648 9.64648C9.02226 10.2707 8.67188 11.1172 8.67188 12C8.67188 12.8828 9.02226 13.7293 9.64648 14.3535C10.2707 14.9777 11.1172 15.3281 12 15.3281C12.8828 15.3281 13.7293 14.9777 14.3535 14.3535C14.9777 13.7293 15.3281 12.8828 15.3281 12C15.3281 11.1172 14.9777 10.2707 14.3535 9.64648C13.7293 9.02226 12.8828 8.67188 12 8.67188ZM12 10.7568C12.3296 10.7568 12.6458 10.888 12.8789 11.1211C13.112 11.3542 13.2432 11.6704 13.2432 12C13.2432 12.3296 13.112 12.6458 12.8789 12.8789C12.6458 13.112 12.3296 13.2432 12 13.2432C11.6704 13.2432 11.3542 13.112 11.1211 12.8789C10.888 12.6458 10.7568 12.3296 10.7568 12C10.7568 11.6704 10.888 11.3542 11.1211 11.1211C11.3542 10.888 11.6704 10.7568 12 10.7568ZM12 10.8571C11.6969 10.8571 11.4062 10.9776 11.1919 11.1919C10.9776 11.4062 10.8571 11.6969 10.8571 12C10.8571 12.3031 10.9776 12.5938 11.1919 12.8081C11.4062 13.0224 11.6969 13.1429 12 13.1429C12.3031 13.1429 12.5938 13.0224 12.8081 12.8081C13.0224 12.5938 13.1429 12.3031 13.1429 12C13.1429 11.6969 13.0224 11.4062 12.8081 11.1919C12.5938 10.9776 12.3031 10.8571 12 10.8571Z\" fill=\"currentColor\"/>\n            </svg>\n          `;\n          selectIcon.title = \"Sélectionner ce calque\";\n          selectIcon.addEventListener(\"click\", () => {\n            parent.postMessage({ pluginMessage: { type: \"select-node\", nodeId: layerId } }, \"*\");\n          });\n          header.appendChild(selectIcon);\n\n          section.appendChild(header);\n\n\n\n          // Split effect-grouped items from regular items so each effect\n          // (Drop Shadow 1 / 2 ...) renders as one indented sub-section\n          // mixing bound + unbound sub-props.\n          const boundSplit = splitEffectsFromItems(items);\n          const unboundSplit = splitEffectsFromItems(unboundItems);\n          const normalItems = boundSplit.normal;\n          const normalUnboundItems = unboundSplit.normal;\n          const effectGroupsBlock = renderEffectGroupsSection(boundSplit.effectItems, unboundSplit.effectItems);\n\n          // Propriétés non variabilisées (hors effets) : rendues inline dans\n          // la layer-section comme les bound rows. Plus de wrapper .danger —\n          // la pill .unbound-variable porte déjà l'identité rouge.\n          if (normalUnboundItems && normalUnboundItems.length > 0) {\n            const groupedUnboundItems = groupSimilarUnboundProperties(normalUnboundItems);\n            section.appendChild(renderItemsList(groupedUnboundItems, true));\n          }\n\n          // Ajouter les variables liées s'il y en a (hors effets)\n          if (normalItems && normalItems.length > 0) {\n            // Grouper les propriétés similaires\n            const groupedItems = groupSimilarProperties(normalItems);\n\n            // Utiliser la fonction renderItemsList pour les éléments liés\n            const ul = renderItemsList(groupedItems, false);\n            section.appendChild(ul);\n          }\n\n          // Effect groups: each Drop Shadow N (or Inner Shadow / Layer Blur)\n          // renders as its own indented sub-section combining bound pills and\n          // unbound danger rows for its sub-props.\n          if (effectGroupsBlock) {\n            section.appendChild(effectGroupsBlock);\n          }\n\n          return section;\n        }\n      };\n\n      // Première vague : rendre VIRT_INITIAL sections immédiatement.\n      const initialCount = Math.min(VIRT_INITIAL, renderableLayers.length);\n      for (let i = 0; i < initialCount; i++) {\n        const sec = buildSection(renderableLayers[i]);\n        if (sec) container.appendChild(sec);\n      }\n\n      // Vagues suivantes : un sentinel IntersectionObserver charge les\n      // batches restants au fur et à mesure que l'utilisateur scrolle.\n      if (initialCount < renderableLayers.length) {\n        let cursor = initialCount;\n        const sentinel = document.createElement('div');\n        sentinel.className = 'virt-sentinel';\n        sentinel.style.cssText = 'height:1px;';\n        container.appendChild(sentinel);\n\n        const flushBatch = () => {\n          const end = Math.min(cursor + VIRT_BATCH, renderableLayers.length);\n          for (let i = cursor; i < end; i++) {\n            const sec = buildSection(renderableLayers[i]);\n            if (sec) container.insertBefore(sec, sentinel);\n          }\n          cursor = end;\n          if (cursor >= renderableLayers.length && sentinel.parentNode) {\n            sentinel.parentNode.removeChild(sentinel);\n          }\n        };\n\n        if (typeof IntersectionObserver === 'function') {\n          const io = new IntersectionObserver(entries => {\n            for (const entry of entries) {\n              if (entry.isIntersecting) {\n                flushBatch();\n                if (cursor >= renderableLayers.length) io.disconnect();\n              }\n            }\n          }, { rootMargin: '200px' });\n          io.observe(sentinel);\n        } else {\n          // Fallback IE/old runtime : rend tout en idle batches.\n          const tick = () => {\n            flushBatch();\n            if (cursor < renderableLayers.length) {\n              (window.requestIdleCallback || window.setTimeout)(tick, 16);\n            }\n          };\n          (window.requestIdleCallback || window.setTimeout)(tick, 16);\n        }\n      }\n    }\n\n    window.onmessage = (event) => handlePluginMessage(event.data.pluginMessage);\n  </script>\n</body>\n\n</html>"
